
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>HUSH. — Private List</title>
  <meta name="description" content="HUSH. — A different kind of night. Iași, Romania.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0.055), transparent 55%);
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 38px 7%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -1.8px;
    }

    .location {
      font-size: 10px;
      color: #777;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 90px 0;
    }

    .eyebrow {
      color: #888;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 35px;
      animation: appear 1s ease both;
    }

    h1 {
      font-size: clamp(48px, 9vw, 105px);
      line-height: 0.98;
      letter-spacing: -6px;
      font-weight: 500;
      max-width: 950px;
      animation: appear 1.2s ease both;
    }

    h1 span {
      color: #777;
    }

    .subtitle {
      margin-top: 28px;
      color: #858585;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.5px;
      line-height: 1.8;
      animation: appear 1.4s ease both;
    }

    .form-area {
      margin-top: 85px;
      width: 100%;
      max-width: 390px;
      animation: appear 1.6s ease both;
    }

    .form-title {
      font-size: 10px;
      letter-spacing: 4px;
      color: #aaa;
      margin-bottom: 28px;
    }

    .field {
      width: 100%;
      margin-bottom: 13px;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 17px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 3px;
      color: white;
      font-family: inherit;
      font-size: 12px;
      outline: none;
      transition: border 0.3s, background 0.3s;
    }

    input::placeholder {
      color: #777;
    }

    input:focus {
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.055);
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: 1px solid #eee;
      border-radius: 3px;
      background: #eee;
      color: #080808;
      font-family: inherit;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: transparent;
      color: white;
    }

    .form-note {
      color: #555;
      font-size: 10px;
      margin-top: 17px;
      line-height: 1.6;
    }

    .success {
      display: none;
      color: #ddd;
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: 20px;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #555;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .page {
        padding: 27px 23px;
      }

      .logo {
        font-size: 23px;
      }

      .location {
        font-size: 8px;
        letter-spacing: 1px;
      }

      main {
        padding: 85px 0;
      }

      h1 {
        font-size: clamp(48px, 13vw, 70px);
        letter-spacing: -3px;
      }

      .subtitle {
        font-size: 12px;
      }

      .form-area {
        margin-top: 65px;
      }

      footer {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="logo">HUSH.</div>
      <div class="location">IAȘI · ROMANIA</div>
    </header>

    <main>
      <div class="eyebrow">Not everything is meant for everyone</div>

      <h1>
        SOME THINGS<br>
        ARE BETTER <span>UNSEEN.</span>
      </h1>

      <p class="subtitle">
        A different kind of night.<br>
        You will know when it's time.
      </p>

      <div class="form-area">
        <div class="form-title">PRIVATE LIST</div>

        <form id="privateForm">
          <div class="field">
            <input type="text" name="name" placeholder="Your name" required>
          </div>

          <div class="field">
            <input type="text" name="instagram" placeholder="Instagram username" required>
          </div>

          <div class="field">
            <input type="email" name="email" placeholder="Email address" required>
          </div>

          <div class="cf-turnstile" data-sitekey="0x4AAAAAAFvToEi-_jdIwLos"></div>

<button type="submit">REQUEST ACCESS ↗</button>
        </form>

        <div class="success" id="successMessage">
          THE PRIVATE LIST WILL OPEN SOON.
        </div>

        <p class="form-note">
          Access is limited. Not everyone gets an invitation.
        </p>
      </div>
    </main>

    <footer>
      <span>HUSH® · 2026</span>
      <span>KEEP IT QUIET.</span>
    </footer>

  </div>

<script>
  document.getElementById('privateForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const form = this;
    const button = form.querySelector('button[type="submit"]');
    const successMessage = document.getElementById('successMessage');

    const name = form.querySelector('[name="name"]').value.trim();
    const instagram = form.querySelector('[name="instagram"]').value.trim();
    const email = form.querySelector('[name="email"]').value.trim();

    button.disabled = true;
    button.textContent = 'SENDING...';

    try {
      const response = await fetch('/api/private-list', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, instagram, email })
      });

      const result = await response.json();

      if (!response.ok) {
        throw new Error(result.error || 'Something went wrong.');
      }

      successMessage.textContent = 'YOUR REQUEST HAS BEEN RECEIVED.';
      successMessage.style.display = 'block';
      form.reset();

    } catch (error) {
      successMessage.textContent = error.message;
      successMessage.style.display = 'block';

    } finally {
      button.disabled = false;
      button.textContent = 'REQUEST ACCESS';
    }
  });
</script>
</body>
</html>
